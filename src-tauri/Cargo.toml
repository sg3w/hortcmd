[package]
name = "hortcmd"
version = "0.1.0"
description = "Dateicommander im Norton-Commander-Stil"
authors = ["you"]
edition = "2021"
license = "MIT"
# Rust 1.93 covers smb 0.12.1 (sspi 0.22) and the russh 0.63 SSH stack (372);
# advisory remediations in tickets 371-377 have no fix below it.
# .cargo/config.toml prefers compatible dependency versions (TICKET-068).
rust-version = "1.93"

default-run = "hortcmd"

[[bin]]
name = "hortcmd-mcp"
path = "src/bin/hortcmd-mcp.rs"

[[test]]
name = "native_plugins"
path = "src/plugins/native_integration_tests.rs"

[lib]
name = "hortcmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.7.4"
unicode-normalization = "0.1"
archive-budget = { path = "../vendor/archive-budget" }
cap-std = "4.0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Randomness for the MCP bearer token (TICKET-041) — already in the
# tree via the TLS stack, named here because this is a security use.
getrandom = "0.3"
ring = "0.17.14" # Authenticated encryption for opt-in search snapshots
sysinfo = "0.31"     # Laufwerke / Mountpunkte
dirs = "5"           # Home-Verzeichnis
ts-rs = "10"         # generiert TS-Typen aus den Rust-Structs
base64 = "0.22"      # Bild-Vorschau als data-URL
opener = "0.7"       # Datei mit Standardprogramm öffnen (F4)
zip = "2"            # Archiv-Handling ZIP (lesen/entpacken/packen, inkl. AES-Passwort)
tar = "0.4"          # tar-Archive lesen/entpacken
flate2 = "1"         # gzip-De-/Kompression (tar.gz)
xz2 = "0.1"          # xz-Dekompression (tar.xz)
sevenz-rust = { version = "0.6", features = ["aes256"] }  # 7z-Archive lesen/entpacken (inkl. Passwort), reines Rust
notify = "6"         # Verzeichnisse auf Änderungen überwachen
trash = "5"          # In den Papierkorb verschieben (statt endgültig löschen)
kamadak-exif = "0.5" # EXIF-Metadaten aus Bildern lesen (Modulname `exif`)
sha2 = "0.10"        # Prüfsummen SHA-256
sha1 = "0.10"        # Prüfsummen SHA-1
md-5 = "0.10"        # Prüfsummen MD5 (Modulname `md5`)
hex = "0.4"          # Hex-Kodierung der Prüfsummen
similar = "2"        # Zeilen-Diff (Myers) für den Dateivergleich
regex = "1"          # Regex für die Suche (Name + Inhalt)
# Lokaler Verzeichnis-Walk der Suche (Ticket 013). Parallel, prunt ignorierte
# Ordner vor dem Abstieg; Auswahl gegen `walkdir` gemessen (docs/traversal-benchmark.md).
jwalk = "0.9"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.63"       # SSH-Client (reines Rust, async) für den SFTP-Provider
russh-sftp = "2.4.0" # SFTP-Client über einen russh-Kanal
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros", "fs", "process"] }
# FTP/FTPS (synchron, Rustls mit Plattform-Zertifikatsprüfung). `deprecated` liefert
# `connect_secure_implicit` — implizites FTPS (Port 990) verlangt Ticket 025.
suppaftp = { version = "6.2.0", features = ["rustls", "deprecated"] }
reqwest_dav = "0.3.3" # WebDAV (PROPFIND/GET/PUT/MKCOL/MOVE/COPY) über reqwest, Basic + Digest
# Reiner Rust-SMB2/3-Client; `multi_threaded` = synchrone API (keine C-Bibliothek,
# damit auch unter Windows nutzbar). Ohne kerberos/quic, um die Deps klein zu halten.
smb = { version = "0.12.1", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }
tokio-util = { version = "0.7.19", features = ["io"] }
reqwest = { version = "0.13", features = ["stream"] }
# Portabler KeePass-Speicher (.kdbx) als Alternative zum Schlüsselbund
# (Ticket 027); `save_kdbx4` = schreiben, nicht nur lesen. Exakt gepinnt:
# neuere Versionen verlangen `hmac ^0.13` (stabil), während `smb`/`sspi` auf
# `hmac =0.13.0-rc.2` festnageln — Cargo kann das nicht vereinen. 0.10.5 ist
# die neueste auflösbare Version; prüfen, sobald `sspi` das Pre-Release verlässt.
keepass = { version = "=0.10.5", features = ["save_kdbx4"] }
fs2 = "0.4.3"
rustls-platform-verifier = "0.7"
x509-parser = "0.18"

# Windows-spezifisch: die Shell-Eigenschaftenseite (TICKET-015) wird über
# `ShellExecuteEx` mit dem Verb "properties" geöffnet; dafür werden COM und
# die Shell-Bindings gebraucht.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry", # SHELLEXECUTEINFOW hängt daran
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Unix-spezifische Rechte-Funktionen (Besitzer, Extended Attributes, ACL).
# Auf Windows nicht verfügbar → dort liefert das Backend leere/None-Werte.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"          # Extended Attributes lesen
uzers = "0.12"       # uid/gid ↔ Benutzer-/Gruppennamen auflösen
exacl = "0.12"       # ACL (Access Control Lists) lesen

# macOS-spezifisch: Finder-Tags liegen als Binär-plist im xattr
# `com.apple.metadata:_kMDItemUserTags`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics"] }
plist = "1"          # Binär-plist lesen/schreiben (Finder-Tags)

[dev-dependencies]
rcgen = "0.13"
# Nur für den Vergleichs-Benchmark der Traversierung (docs/traversal-benchmark.md),
# damit die Messung jwalk↔walkdir reproduzierbar bleibt.
walkdir = "2"

[features]
# Standardfeatures für ein reguläres Tauri-Build.
custom-protocol = ["tauri/custom-protocol"]

# TICKET-096: add an authenticated SMB2 ECHO health check to smb 0.12.1.
[patch.crates-io]
suppaftp = { path = "../vendor/suppaftp" }
smb = { path = "../vendor/smb" }

sevenz-rust = { path = "../vendor/sevenz-rust" }
zip = { path = "../vendor/zip" }
tar = { path = "../vendor/tar" }

# TICKET-271: recognize runtime-only enum guards and omitted Option fields.
ts-rs-macros = { path = "../vendor/ts-rs-macros" }
