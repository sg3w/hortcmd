[package]
name = "hortcmd"
version = "0.1.0"
description = "Dateicommander im Total-Commander-Stil"
authors = ["you"]
edition = "2021"
# 1.85 wird vom reinen Rust-SMB-Client (`smb`) verlangt; ältere MSRV zwingt
# Cargo außerdem zu veralteten, untereinander inkompatiblen Transitiv-Deps.
rust-version = "1.85"

[lib]
name = "hortcmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"     # Laufwerke / Mountpunkte
dirs = "5"           # Home-Verzeichnis
ts-rs = "10"         # generiert TS-Typen aus den Rust-Structs
base64 = "0.22"      # Bild-Vorschau als data-URL
opener = "0.7"       # Datei mit Standardprogramm öffnen (F4)
zip = "2"            # Archiv-Handling ZIP (lesen/entpacken/packen, inkl. AES-Passwort)
tar = "0.4"          # tar-Archive lesen/entpacken
flate2 = "1"         # gzip-De-/Kompression (tar.gz)
xz2 = "0.1"          # xz-Dekompression (tar.xz)
sevenz-rust = "0.6"  # 7z-Archive lesen/entpacken (inkl. Passwort), reines Rust
notify = "6"         # Verzeichnisse auf Änderungen überwachen
trash = "5"          # In den Papierkorb verschieben (statt endgültig löschen)
kamadak-exif = "0.5" # EXIF-Metadaten aus Bildern lesen (Modulname `exif`)
sha2 = "0.10"        # Prüfsummen SHA-256
sha1 = "0.10"        # Prüfsummen SHA-1
md-5 = "0.10"        # Prüfsummen MD5 (Modulname `md5`)
hex = "0.4"          # Hex-Kodierung der Prüfsummen
similar = "2"        # Zeilen-Diff (Myers) für den Dateivergleich
regex = "1"          # Regex für die Suche (Name + Inhalt)
# Lokaler Verzeichnis-Walk der Suche (Ticket 013). Parallel, prunt ignorierte
# Ordner vor dem Abstieg; Auswahl gegen `walkdir` gemessen (docs/traversal-benchmark.md).
jwalk = "0.9"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.53"       # SSH-Client (reines Rust, async) für den SFTP-Provider
russh-sftp = "2.4.0" # SFTP-Client über einen russh-Kanal
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros", "fs"] }
# FTP/FTPS (synchron, TLS über system-native-tls). `deprecated` liefert
# `connect_secure_implicit` — implizites FTPS (Port 990) verlangt Ticket 025.
suppaftp = { version = "6.2.0", features = ["native-tls", "deprecated"] }
reqwest_dav = "0.3.3" # WebDAV (PROPFIND/GET/PUT/MKCOL/MOVE/COPY) über reqwest, Basic + Digest
# Reiner Rust-SMB2/3-Client; `multi_threaded` = synchrone API (keine C-Bibliothek,
# damit auch unter Windows nutzbar). Ohne kerberos/quic, um die Deps klein zu halten.
smb = { version = "0.11.1", default-features = false, features = ["multi_threaded", "sign", "encrypt"] }
tokio-util = { version = "0.7.19", features = ["io"] }
reqwest = { version = "0.13", features = ["stream"] }

# Windows-spezifisch: die Shell-Eigenschaftenseite (TICKET-015) wird über
# `ShellExecuteEx` mit dem Verb "properties" geöffnet; dafür werden COM und
# die Shell-Bindings gebraucht.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry", # SHELLEXECUTEINFOW hängt daran
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Unix-spezifische Rechte-Funktionen (Besitzer, Extended Attributes, ACL).
# Auf Windows nicht verfügbar → dort liefert das Backend leere/None-Werte.
[target.'cfg(unix)'.dependencies]
xattr = "1"          # Extended Attributes lesen
uzers = "0.12"       # uid/gid ↔ Benutzer-/Gruppennamen auflösen
exacl = "0.12"       # ACL (Access Control Lists) lesen

# macOS-spezifisch: Finder-Tags liegen als Binär-plist im xattr
# `com.apple.metadata:_kMDItemUserTags`.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"          # Binär-plist lesen/schreiben (Finder-Tags)

[dev-dependencies]
# Nur für den Vergleichs-Benchmark der Traversierung (docs/traversal-benchmark.md),
# damit die Messung jwalk↔walkdir reproduzierbar bleibt.
walkdir = "2"

[features]
# Standardfeatures für ein reguläres Tauri-Build.
custom-protocol = ["tauri/custom-protocol"]
