# ============================================================
# The remote-protocol harness (TICKET-038) — scheduled and manual.
#
# These are the `#[ignore]`d `harness_` tests: they talk to real SFTP,
# FTP, explicit and implicit FTPS, SMB and WebDAV servers. The servers
# are not somebody's infrastructure — the harness builds and starts them
# per run, seeds them, and tears them down again, so this needs Docker
# and nothing else. No account, no credential, no public network.
#
# It is not part of pull-request CI, for two reasons: it takes minutes
# rather than seconds, and it starts containers, which is more trust
# than a pull request from a fork should get. It runs on a schedule so a
# wire-protocol regression is found within a week rather than whenever
# somebody next touches a provider, and on demand for the branch that
# changed one.
#
# Locally it is one command, and the same one:
#
#   npm run test:harness
#
# The OS-keychain tests (`*_live` in net/credentials.rs) are a separate
# matter: they need a desktop keyring and an interactive session, so
# they stay local-only.
# ============================================================

name: Protocol harness

on:
  workflow_dispatch:
    inputs:
      keep:
        description: >-
          Leave the servers running after the suite (for a debugging
          session on a self-hosted runner). Normally "false".
        type: boolean
        required: false
        default: false
  schedule:
    # Mondays, 04:17 UTC — off the hour, because every scheduled
    # workflow in the world runs on the hour.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  harness:
    name: SFTP · FTP · FTPS · SMB · WebDAV
    runs-on: ubuntu-latest
    # The suite itself takes about two minutes; the rest is building the
    # service images and compiling the test binary. The cap is there so
    # a hung server cannot burn an hour of runner time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run the protocol harness
        run: node harness/harness.mjs run ${{ inputs.keep && '--keep' || '' }}

      # Only on failure, and only the redacted copies the harness writes:
      # the run's password, private key and CA key are scrubbed out of
      # these before they are written, and the run directory that holds
      # the originals is deleted with the run.
      - name: Collect the service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: harness/.run/*-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Make sure nothing is left running
        if: always()
        run: node harness/harness.mjs down
