# ============================================================
# Live protocol and keychain tests (TICKET-033) — manual only.
#
# These are the `#[ignore]`d tests: they talk to real SFTP/FTP/SMB/
# WebDAV servers and to the OS keychain. They are deliberately not part
# of pull-request CI, because they need credentials and because a
# pull request from a fork must never be able to reach them.
#
# Run them locally instead — that is the supported path, and the Docker
# commands for each server are in the doc comment above each test:
#
#   cargo test --manifest-path src-tauri/Cargo.toml --lib live_ \
#     -- --ignored --nocapture --test-threads=1
#
# Dispatching this workflow without the servers configured is expected
# to stop with the setup message below rather than pretend to pass.
# ============================================================

name: Live tests (manual)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: >-
          Type "i-have-servers" to confirm the protocol servers named in
          the test doc comments are reachable from this runner.
        required: true
        default: ""

permissions:
  contents: read

jobs:
  live:
    name: Live protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Check the prerequisites are acknowledged
        if: inputs.acknowledge != 'i-have-servers'
        run: |
          echo "::error::Live tests need real SFTP/FTP/SMB/WebDAV servers."
          echo "Start them with the Docker commands in the doc comment above each"
          echo "test in src-tauri/src/vfs/live_tests.rs, then run locally:"
          echo
          echo "  cargo test --manifest-path src-tauri/Cargo.toml --lib live_ \\"
          echo "    -- --ignored --nocapture --test-threads=1"
          echo
          echo "GitHub-hosted runners have none of these servers, so this"
          echo "workflow stops here on purpose."
          exit 1

      - uses: actions/checkout@v4

      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run the ignored live tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib live_ \
            -- --ignored --nocapture --test-threads=1
