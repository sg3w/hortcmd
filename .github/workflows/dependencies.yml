name: Dependency governance
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Offline license, source, scripts, assets and expiry policy
        run: npm run check:dependencies
      - name: Generate and verify release evidence
        run: npm run supply:bundle
      - name: Install pinned advisory scanner
        run: cargo install cargo-deny --version 0.19.5 --locked
      - name: Rust advisories/yanks and npm vulnerabilities (explicit public registries)
        run: npm run audit:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 14
