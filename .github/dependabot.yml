version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      testing:
        patterns: ['@testing-library/*', '@types/*']
        update-types: [patch]
    labels: [dependencies]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
