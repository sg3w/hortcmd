[advisories]
yanked = "deny"
unmaintained = "all"
maximum-db-staleness = "P7D"
unused-ignored-advisory = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "ISC", "BSD-2-Clause", "BSD-3-Clause", "BSD-1-Clause", "0BSD", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "MIT-0", "Apache-2.0 WITH LLVM-exception", "BSL-1.0", "CDLA-Permissive-2.0"]
